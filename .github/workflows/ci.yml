name: Release gate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install uv
        run: python -m pip install uv==0.11.7
      - name: Install locked dependencies
        run: uv sync --locked --extra dev
      - name: Validate source and installed wheel
        run: uv run python scripts/check_release.py
